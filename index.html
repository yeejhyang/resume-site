<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八股背诵工作台</title>
<style>
  :root {
    --blue: #2563EB; --navy: #1E3A8A; --ink: #1f2937;
    --bg: #f5f7fb; --card: #fff; --muted: #6b7280;
    --tag: #eff6ff; --tag-ink: #1d4ed8; --gold: #b45309; --gold-bg: #fffbeb;
    --teal: #0f766e; --teal-bg: #14b8a6;
    --green: #16a34a; --yellow: #ca8a04; --red: #dc2626;
    --side-border: #e5e7eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    line-height: 1.7;
  }
  .layout { display: flex; height: 100vh; }

  /* ===== 左侧 ===== */
  .sidebar {
    flex: 0 0 340px; min-width: 300px;
    background: var(--card); border-right: 1px solid var(--side-border);
    display: flex; flex-direction: column;
  }
  .side-top {
    padding: 16px 18px 12px;
    border-bottom: 1px solid #eef2f7;
  }
  .side-top .app-title { font-size: 17px; font-weight: 800; color: #111827; display: flex; align-items: center; gap: 8px; }
  .side-top .app-title .logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg,#0f766e,#14b8a6); color:#fff;
    display:inline-flex; align-items:center; justify-content:center; font-size:15px;
  }
  .search-box { margin-top: 12px; position: relative; }
  .search-box input {
    width: 100%; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 8px 12px 8px 34px; font-size: 13px; font-family: inherit;
    background: #f8fafc; transition: .15s;
  }
  .search-box input:focus { outline: none; border-color: var(--teal-bg); background: #fff; box-shadow: 0 0 0 2px rgba(20,184,166,.12); }
  .search-box .sicon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 14px; }
  .search-box .sclear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none; background: none; color: #9ca3af; cursor: pointer; font-size: 14px; display: none; }
  .search-box.has-input .sclear { display: block; }

  .progress-wrap { margin-top: 12px; }
  .progress-bar-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .progress-bar { height: 6px; background: #eef1f5; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#16a34a,#14b8a6); border-radius: 4px; transition: width .3s; }

  .tree-wrap { flex: 1; overflow-y: auto; padding: 8px 0 24px; }
  .tree { list-style: none; }

  .cat {
    border-bottom: 1px solid #f4f6f9;
  }
  .cat-head {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 18px; cursor: pointer; user-select: none;
    font-weight: 700; font-size: 14px; color: #374151; transition: background .12s;
  }
  .cat-head:hover { background: #f3f6f9; color: var(--teal); }
  .cat-head .caret { width: 14px; text-align: center; color: #cbd5e1; font-size: 12px; transition: transform .18s; }
  .cat.open > .cat-head { color: var(--teal); }
  .cat.open > .cat-head .caret { transform: rotate(90deg); color: var(--teal-bg); }
  .cat-head .name { flex: 1; }
  .cat-head .cnt { font-size: 11px; color: var(--muted); font-weight: 500; background: #f1f3f6; padding: 1px 8px; border-radius: 10px; }

  .file-item {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 18px 7px 40px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: #374151; transition: background .12s;
    border-left: 3px solid transparent;
  }
  .file-item:hover { background: #f3f6f9; color: var(--teal); }
  .file-item.active { background: #eef7f5; color: var(--teal); border-left-color: var(--teal-bg); font-weight: 700; }
  .file-item .fname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-item .fprog { font-size: 11px; color: var(--muted); font-weight: 500; }
  .file-item .fcaret { flex: none; width: 12px; text-align: center; color: #cbd5e1; font-size: 11px; transition: transform .18s; }
  .file-li.expanded > .file-item .fcaret { transform: rotate(90deg); color: var(--teal-bg); }
  .file-li > ul { display: none; }
  .file-li.expanded > ul { display: block; }

  .sec-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 18px 7px 58px; cursor: pointer;
    font-size: 12.5px; font-weight: 500; color: #4b5563; transition: background .12s;
    border-left: 3px solid transparent; line-height: 1.4;
  }
  .sec-item:hover { background: #f3f6f9; color: var(--teal); }
  .sec-item.active { background: #eef7f5; color: var(--teal); border-left-color: var(--teal-bg); font-weight: 700; }
  .sec-item .sec-name { flex: 1; }
  .sec-item .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: #e5e7eb; }
  .dot.known { background: var(--green); }
  .dot.fuzzy { background: var(--yellow); }
  .dot.unfamiliar { background: var(--red); }

  .empty-search { padding: 24px 18px; font-size: 12.5px; color: var(--muted); text-align: center; }

  /* ===== 右侧 ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--side-border);
  }
  .topbar .crumb { font-size: 12.5px; color: var(--muted); }
  .topbar .crumb b { color: var(--teal); }
  .topbar .spacer { flex: 1; }
  .tool-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .tool-group button, .mode-group button {
    border: 1px solid #99d6cd; background: #fff; color: #0f766e;
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 16px; cursor: pointer; transition: all .15s;
  }
  .tool-group button:hover, .mode-group button:hover { background: #0f766e; color: #fff; }
  .mode-group button.active { background: #0f766e; color: #fff; }
  .mode-group button.danger.active { background: #dc2626; border-color: #dc2626; color:#fff; }

  .content-wrap { flex: 1; overflow-y: auto; padding: 24px 26px 60px; }
  .content-inner { max-width: 980px; margin: 0 auto; }

  /* 渲染后的文档样式 */
  .doc-head {
    background: linear-gradient(135deg, #0f766e, #14b8a6); color: #fff;
    border-radius: 14px; padding: 26px 30px; margin-bottom: 18px;
  }
  .doc-head h1 { font-size: 21px; font-weight: 800; }
  .doc-head .crumb { font-size: 12px; opacity: .9; margin-bottom: 4px; }
  .doc-head p { opacity: .92; font-size: 13px; margin-top: 6px; }
  .doc-badge { display:inline-block; background: rgba(255,255,255,.18); border-radius: 20px; padding: 2px 12px; font-size: 12px; margin-right: 8px; margin-top: 8px; }

  .doc-section { background: var(--card); border-radius: 14px; padding: 22px 26px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .doc-section h2 { font-size: 16.5px; color: var(--teal); border-left: 4px solid var(--teal-bg); padding-left: 10px; margin-bottom: 14px; }

  .doc-qa { margin-bottom: 12px; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; background: #fff; transition: box-shadow .15s, border-color .15s; }
  .doc-qa:hover { border-color: #99d6cd; }
  .doc-qa:last-child { margin-bottom: 0; }
  .doc-q { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-weight: 700; font-size: 14px; color: #111827; padding: 11px 14px; background: #f8fafc; }
  .doc-q:hover { background: #eef7f5; }
  .doc-q .qicon { flex:none; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; background:var(--teal-bg); color:#fff; border-radius:6px; font-size:11px; font-weight:800; }
  .doc-q .qtext { flex: 1; line-height: 1.5; }
  .doc-q .caret { flex:none; color:#9ca3af; font-size:13px; transition: transform .18s; width:14px; text-align:center; }
  .doc-qa.open .caret { transform: rotate(90deg); }
  .doc-a { display: none; padding: 12px 14px 14px 22px; font-size: 13.5px; color: #374151; border-left: 3px solid #e6f1ef; margin-left: 14px; margin-right: 14px; margin-bottom: 14px; }
  .doc-qa.open .doc-a { display: block; }
  .doc-a ul { margin: 6px 0 6px 18px; }
  .doc-a li { margin-bottom: 6px; }
  .doc-a p { margin-bottom: 8px; }
  .doc-a b { color: #111827; }
  .doc-a code { font-family: "SF Mono",Menlo,monospace; font-size: 12px; background: #f3f4f6; padding: 1px 5px; border-radius: 4px; color: #b91c1c; }
  .doc-a pre { background:#1f2937; color:#e5e7eb; padding:12px 14px; border-radius:8px; overflow-x:auto; font-size:12px; line-height:1.6; margin:8px 0; }
  .doc-a pre code { background:transparent; color:inherit; padding:0; }
  .doc-a table { border-collapse: collapse; width:100%; margin:10px 0; font-size:13px; }
  .doc-a th, .doc-a td { border:1px solid #e5e7eb; padding:7px 10px; text-align:left; }
  .doc-a th { background:#eef7f5; color:#0f766e; }

  /* 掌握度按钮组（每题） */
  .mastery-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px dashed #e5e7eb; margin:0 14px 12px; flex-wrap:wrap; }
  .mastery-bar .lbl { font-size:11.5px; color:var(--muted); }
  .mastery-bar button {
    border:1px solid #e5e7eb; background:#fff; font-size:11.5px; font-weight:600;
    padding:2px 10px; border-radius:12px; cursor:pointer; color:#6b7280; transition:all .15s;
  }
  .mastery-bar button:hover { transform: translateY(-1px); }
  .mastery-bar button[data-m="known"]:hover, .mastery-bar button[data-m="known"].on { background:#dcfce7; border-color:#16a34a; color:#15803d; }
  .mastery-bar button[data-m="fuzzy"]:hover, .mastery-bar button[data-m="fuzzy"].on { background:#fef9c3; border-color:#ca8a04; color:#a16207; }
  .mastery-bar button[data-m="unfamiliar"]:hover, .mastery-bar button[data-m="unfamiliar"].on { background:#fee2e2; border-color:#dc2626; color:#b91c1c; }

  /* 抽背模式 */
  body.quiz-mode .doc-a { display: none !important; }
  body.quiz-mode .doc-qa.open .doc-a { display: block !important; }
  .quiz-hint { background: var(--gold-bg); border:1px solid #fde68a; border-radius:8px; padding:12px 16px; font-size:13px; color:#78350f; margin-bottom:14px; line-height:1.7; display:none; }
  body.quiz-mode .quiz-hint { display:block; }
  .random-btn { margin-right: auto; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; padding: 10px 22px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .3s; z-index: 99;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .welcome {
    text-align:center; padding: 60px 30px; color: var(--muted);
  }
  .welcome .big { font-size: 42px; margin-bottom: 16px; }
  .welcome h2 { font-size: 20px; color: var(--ink); margin-bottom: 10px; }
  .welcome p { font-size: 13.5px; margin-bottom: 6px; }

  .loading { text-align:center; padding: 60px; color: var(--muted); font-size: 14px; }

  @media (max-width: 860px) {
    .layout { flex-direction: column; height: auto; }
    .sidebar { flex: none; width: 100%; min-width: 0; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--side-border); }
    .main { height: auto; }
    .content-wrap { padding: 16px; }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- ===== 左侧目录树 ===== -->
  <aside class="sidebar">
    <div class="side-top">
      <div class="app-title"><span class="logo">八</span>八股背诵工作台</div>
      <div class="search-box" id="searchBox">
        <span class="sicon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索题目 / 关键词…">
        <button class="sclear" id="searchClear" title="清除">✕</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar-row">
          <span>背诵进度</span>
          <span id="progressText">0 / 0（0%）</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="tree-wrap">
      <ul class="tree" id="tree"></ul>
      <div class="empty-search" id="emptySearch" style="display:none;">没有匹配的题目</div>
    </div>
  </aside>

  <!-- ===== 右侧内容区 ===== -->
  <main class="main">
    <div class="topbar">
      <span class="crumb" id="crumb">八股背诵工作台</span>
      <span class="spacer"></span>
      <div class="mode-group">
        <button id="btnQuiz" class="danger">抽背盲答</button>
      </div>
      <div class="tool-group">
        <button id="btnRandom" title="随机抽一题">🎲 随机</button>
        <button id="btnExpand">全部展开</button>
        <button id="btnCollapse">只看问题</button>
      </div>
    </div>
    <div class="content-wrap" id="contentWrap">
      <div class="content-inner" id="content">
        <div class="welcome">
          <div class="big">📚</div>
          <h2>欢迎来到八股背诵工作台</h2>
          <p>从左侧选择一篇文章开始背诵，或点击「🎲 随机」随机抽题。</p>
          <p>每题可标记 🟢熟了 / 🟡生疏 / 🔴不会，进度会自动保存。</p>
          <p>「抽背盲答」模式会隐藏所有答案，适合自测。</p>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ===== 文件注册表 =====
  var FILE_META = {
    '技术类别-01-大模型后训练.html': { cat: 'tech', catName: '技术类别', name: '大模型后训练', tags: 'SFT/RLHF/DPO/GRPO' },
    '技术类别-01-Agent面试题.html': { cat: 'tech', catName: '技术类别', name: 'Agent 面试题', tags: 'Agent 定义/工具调用/MCP' },
    '技术类别-02-Agent工程.html':   { cat: 'tech', catName: '技术类别', name: 'Agent 工程', tags: 'ReAct/MCP/LangGraph' },
    '技术类别-03-RAG检索.html':     { cat: 'tech', catName: '技术类别', name: 'RAG 检索', tags: 'RRF/Rerank/Milvus' },
    '技术类别-04-Java后端.html':    { cat: 'tech', catName: '技术类别', name: 'Java 后端', tags: 'HashMap/线程池/Spring' },
    '技术类别-05-数据库.html':      { cat: 'tech', catName: '技术类别', name: '数据库', tags: 'B+树/MVCC/Redis' },
    '01-CodeForge-Agent引擎.html':  { cat: 'proj', catName: '项目', name: 'CodeForge Agent 引擎', tags: '架构重构/MCP' },
    '02-EVIDE-多模态后训练.html':   { cat: 'proj', catName: '项目', name: 'EVIDE 多模态后训练', tags: 'AAAI 2027/GRPO/LoRA' },
    '03-RAGent-检索平台.html':      { cat: 'proj', catName: '项目', name: 'RAGent 检索平台', tags: 'RAG/Java/Milvus' },
    '00-面试自我介绍.html':         { cat: 'interview', catName: '面试', name: '面试自我介绍', tags: '背诵稿' }
  };
  // 分类顺序
  var CAT_ORDER = ['tech', 'proj', 'interview'];
  var CAT_NAME = { tech: '技术类别', proj: '项目', interview: '面试' };

  // ===== DOM =====
  var tree = document.getElementById('tree');
  var content = document.getElementById('content');
  var contentWrap = document.getElementById('contentWrap');
  var crumb = document.getElementById('crumb');
  var searchInput = document.getElementById('searchInput');
  var searchBox = document.getElementById('searchBox');
  var searchClear = document.getElementById('searchClear');
  var emptySearch = document.getElementById('emptySearch');
  var progressText = document.getElementById('progressText');
  var progressFill = document.getElementById('progressFill');
  var btnQuiz = document.getElementById('btnQuiz');
  var btnRandom = document.getElementById('btnRandom');
  var btnExpand = document.getElementById('btnExpand');
  var btnCollapse = document.getElementById('btnCollapse');
  var toast = document.getElementById('toast');

  // ===== 状态 =====
  var state = {
    currentFile: null,   // 当前渲染的文件名
    sections: [],        // 当前文件解析出的 section 列表 [{el, name}]
    quizMode: false,
    // 各文件缓存的 fetch 结果
    cache: {}
  };

  // ===== localStorage 键 =====
  var KEY_M = 'baback.mastery.v1';   // {file: {qtext: m}}
  var KEY_EXPAND = 'baback.expand.v1';
  var KEY_QUIZ = 'baback.quiz.v1';

  function loadJSON(key, def) { try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? def : v; } catch(e){ return def; } }
  function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

  var mastery = loadJSON(KEY_M, {});
  var expandedCats = loadJSON(KEY_EXPAND, { 'tech': true, 'proj': true, 'interview': true });
  var expandedFiles = {}; // 文件项的 section 子列表展开状态（内存态）

  function qkey(file, qtext) { return file + '::' + qtext; }
  function toastMsg(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }

  // ===== 目录树构建 =====
  function buildTree(filter) {
    tree.innerHTML = '';
    var totalKnown = 0, totalMarked = 0, totalQ = 0;

    CAT_ORDER.forEach(function (catId) {
      var files = Object.keys(FILE_META).filter(function (f) { return FILE_META[f].cat === catId; });
      if (!files.length) return;

      var catLi = document.createElement('li');
      catLi.className = 'cat' + (expandedCats[catId] ? ' open' : '');

      var head = document.createElement('div');
      head.className = 'cat-head';
      head.innerHTML = '<span class="caret">▸</span><span class="name">' + CAT_NAME[catId] + '</span><span class="cnt">' + files.length + ' 篇</span>';
      head.addEventListener('click', function () {
        var open = catLi.classList.toggle('open');
        expandedCats[catId] = open; saveJSON(KEY_EXPAND, expandedCats);
      });
      catLi.appendChild(head);

      var childUl = document.createElement('ul');
      childUl.className = 'tree';

      files.forEach(function (fname) {
        var meta = FILE_META[fname];
        // 统计该文件的已标记/总数（如果有缓存）
        var fileMarked = countMarkedForFile(fname);
        var fileTotal = fileTotalQ(fname);

        var fileLi = document.createElement('li');
        fileLi.className = 'file-li';
        var sections = state.cache[fname] && state.cache[fname].sections;
        // 展开状态：完全由用户点击控制（默认收起，点击展开）
        if (expandedFiles[fname]) fileLi.classList.add('expanded');

        var fItem = document.createElement('div');
        fItem.className = 'file-item' + (state.currentFile === fname ? ' active' : '');
        var pct = fileTotal ? Math.round(fileMarked / fileTotal * 100) : 0;
        fItem.innerHTML =
          (sections ? '<span class="fcaret">▸</span>' : '<span class="fcaret"></span>') +
          '<span class="fname">' + meta.name + '</span>' +
          (fileTotal ? '<span class="fprog">' + fileMarked + '/' + fileTotal + '</span>' : '');
        fItem.addEventListener('click', function () {
          // toggle 展开/收起 section 子列表（无论文件是否已加载）
          var wasExpanded = fileLi.classList.contains('expanded');
          fileLi.classList.toggle('expanded');
          expandedFiles[fname] = !wasExpanded;
          loadFile(fname);
        });
        fileLi.appendChild(fItem);

        // 子 section（仅在已加载时显示）
        var secUl = document.createElement('ul');
        secUl.className = 'tree';
        if (sections) {
          sections.forEach(function (sec, idx) {
            var dotCls = sectionMasteryDot(fname, sec);
            var secItem = document.createElement('div');
            secItem.className = 'sec-item';
            secItem.dataset.file = fname;
            secItem.dataset.idx = idx;
            secItem.innerHTML = '<span class="dot ' + dotCls + '"></span><span class="sec-name">' + sec.name + '</span>';
            secItem.addEventListener('click', function (e) {
              e.stopPropagation();
              loadFile(fname, idx);
            });
            secUl.appendChild(secItem);
          });
        }
        fileLi.appendChild(secUl);
        childUl.appendChild(fileLi);
      });

      catLi.appendChild(childUl);
      tree.appendChild(catLi);
    });

    // 更新进度
    var markedAll = countAllMarked();
    var totalAll = totalAllQ();
    progressText.textContent = markedAll + ' / ' + totalAll + '（' + (totalAll ? Math.round(markedAll/totalAll*100) : 0) + '%）';
    progressFill.style.width = (totalAll ? Math.min(100, markedAll/totalAll*100) : 0) + '%';
  }

  function countMarkedForFile(fname) {
    var n = 0;
    Object.keys(mastery).forEach(function (k) { if (k.indexOf(fname + '::') === 0) n++; });
    return n;
  }
  function countAllMarked() { return Object.keys(mastery).length; }
  function fileTotalQ(fname) {
    var c = state.cache[fname];
    if (!c || !c.sections) return 0;
    var n = 0;
    c.sections.forEach(function (s) { n += s.qCount; });
    return n;
  }
  function totalAllQ() {
    var n = 0;
    Object.keys(FILE_META).forEach(function (f) { n += fileTotalQ(f); });
    return n;
  }

  // ===== 加载文件 =====
  function loadFile(fname, scrollIdx) {
    // 更新当前选中
    state.currentFile = fname;
    crumb.textContent = FILE_META[fname] ? FILE_META[fname].catName + ' / ' + FILE_META[fname].name : fname;
    buildTree();

    content.innerHTML = '<div class="loading">加载中…</div>';
    var done = function () {
      renderFile(fname, state.cache[fname]);
      if (scrollIdx != null) scrollToSec(scrollIdx);
    };

    if (state.cache[fname]) {
      done();
    } else {
      fetch(fname).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (html) {
        state.cache[fname] = parseDocument(html);
        done();
        buildTree(); // 重新渲染目录以显示 section
      }).catch(function (e) {
        content.innerHTML = '<div class="welcome"><div class="big">⚠️</div><h2>加载失败</h2><p>' + e.message + '</p><p>请通过 <code>node server.js</code> 启动本地服务后访问（file:// 协议下无法 fetch）。</p></div>';
      });
    }
  }

  // ===== 解析 HTML 文档为可渲染结构 =====
  function parseDocument(html) {
    var doc = document.implementation.createHTMLDocument('');
    doc.documentElement.innerHTML = html;
    // 提取样式
    var styles = Array.prototype.map.call(doc.querySelectorAll('style'), function (s) { return s.textContent; }).join('\n');
    // 提取 header 部分
    var header = doc.querySelector('header');
    var headerHtml = header ? header.outerHTML : '';

    // 规范化：把原文件的 .qa/.q/.a 转成 .doc-qa/.doc-q/.doc-a，并标准化 qtext
    doc.querySelectorAll('div.qa').forEach(function (qa) {
      var q = qa.querySelector('.q');
      if (q) {
        // 包装问题文本为 .qtext
        var text = q.innerHTML.trim();
        q.innerHTML = '<span class="qicon">Q</span><span class="qtext">' + text + '</span><span class="caret">▸</span>';
        q.className = 'doc-q';
      }
      var a = qa.querySelector('.a');
      if (a) a.className = 'doc-a';
      qa.className = 'doc-qa';

      // 移除运行时才会生成的 answer-box / fix-bar（源文件里一般没有，防御性清理）
      var box = qa.querySelector('.answer-box');
      if (box) box.parentNode.removeChild(box);
      var fix = qa.querySelector('.fix-bar');
      if (fix) fix.parentNode.removeChild(fix);
    });

    // 提取所有 section（h2 分组）
    var sections = [];
    doc.querySelectorAll('div.section').forEach(function (sec) {
      var h2 = sec.querySelector('h2');
      var name = h2 ? h2.textContent.trim() : '(未命名小节)';
      var qCount = sec.querySelectorAll('.doc-qa').length;
      // 收集该 section 的所有问题文本（供搜索）
      var qTexts = [];
      sec.querySelectorAll('.doc-q .qtext').forEach(function (qel) { qTexts.push(qel.textContent.trim()); });
      // 重建 section 内容：只保留 h2 + doc-qa
      var inner = '<h2>' + name + '</h2>';
      sec.querySelectorAll('.doc-qa').forEach(function (qa) { inner += qa.outerHTML; });
      sections.push({ name: name, qCount: qCount, qTexts: qTexts, innerHTML: inner });
    });
    return { styles: styles, headerHtml: headerHtml, sections: sections };
  }

  // ===== 渲染文件 =====
  function renderFile(fname, data) {
    var html = '';
    // header（复用原文件 header，但去掉多余的返回链接等）
    if (data.headerHtml) {
      // 清理 header 里的 back 链接
      var h = data.headerHtml.replace(/<a[^>]*class="back"[^>]*>.*?<\/a>/g, '');
      html += '<div class="doc-head">' + h + '</div>';
    }
    // sections
    data.sections.forEach(function (sec, idx) {
      html += '<div class="doc-section" data-idx="' + idx + '">' + sec.innerHTML + '</div>';
    });

    content.innerHTML = html;

    // 绑定交互
    bindDocInteractions(fname);

    // 样式注入
    var styleEl = document.getElementById('doc-style');
    if (!styleEl) { styleEl = document.createElement('style'); styleEl.id = 'doc-style'; document.head.appendChild(styleEl); }
    // 只保留 doc- 相关样式，避免污染
    styleEl.textContent = data.styles + '\n/* 覆盖：隐藏原 answer-box 的服务器同步按钮 */';

    // 注入掌握度按钮到每个 qa
    injectMasteryBars(fname);

    if (state.quizMode) document.body.classList.add('quiz-mode');
    contentWrap.scrollTop = 0;
  }

  function bindDocInteractions(fname) {
    // Q&A 折叠
    content.querySelectorAll('.doc-qa').forEach(function (qa) {
      var q = qa.querySelector('.doc-q');
      if (!q) return;
      q.addEventListener('click', function () { qa.classList.toggle('open'); });
    });
    // 记录当前文件所有 qa 供掌握度使用
    state.sections = Array.prototype.map.call(content.querySelectorAll('.doc-section'), function (s) {
      return { el: s, name: s.querySelector('h2').textContent.trim() };
    });
  }

  // ===== 掌握度按钮 =====
  function injectMasteryBars(fname) {
    content.querySelectorAll('.doc-qa').forEach(function (qa) {
      var qtextEl = qa.querySelector('.doc-q .qtext');
      if (!qtextEl) return;
      var qtext = qtextEl.textContent.trim();
      var qk = qkey(fname, qtext);
      var cur = mastery[qk] || '';

      var bar = document.createElement('div');
      bar.className = 'mastery-bar';
      bar.innerHTML =
        '<span class="lbl">掌握度：</span>' +
        '<button data-m="known" title="熟了">🟢 熟了</button>' +
        '<button data-m="fuzzy" title="生疏">🟡 生疏</button>' +
        '<button data-m="unfamiliar" title="不会">🔴 不会</button>';
      bar.querySelectorAll('button').forEach(function (btn) {
        if (btn.dataset.m === cur) btn.classList.add('on');
        btn.addEventListener('click', function () {
          var m = btn.dataset.m;
          // 切换：再点一次取消
          if (mastery[qk] === m) { delete mastery[qk]; }
          else { mastery[qk] = m; }
          saveJSON(KEY_M, mastery);
          bar.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === (mastery[qk]||'')); });
          updateMasteryDots(fname);
          buildTree();
          toastMsg(m === 'known' ? '标记为：🟢 熟了' : m === 'fuzzy' ? '标记为：🟡 生疏' : '标记为：🔴 不会');
        });
      });
      qa.appendChild(bar);
    });
  }

  // 汇总一个 section 内所有题目的掌握度，返回圆点 class
  // 优先级：有「不会」→ red；否则有「生疏」→ yellow；有「熟了」→ green；都标记但无规则 → 混合取 green；无标记 → ''
  function sectionMasteryDot(fname, sec) {
    var data = state.cache[fname];
    if (!data) return '';
    // 解析该 section 的所有问题文本
    var tmp = document.createElement('div');
    tmp.innerHTML = sec.innerHTML;
    var qtexts = [];
    tmp.querySelectorAll('.doc-q .qtext').forEach(function (qel) { qtexts.push(qel.textContent.trim()); });

    var hasRed = false, hasYellow = false, hasGreen = false, hasAny = false;
    qtexts.forEach(function (t) {
      var m = mastery[qkey(fname, t)];
      if (m) { hasAny = true; }
      if (m === 'unfamiliar') hasRed = true;
      else if (m === 'fuzzy') hasYellow = true;
      else if (m === 'known') hasGreen = true;
    });
    if (!hasAny) return '';
    if (hasRed) return 'unfamiliar';
    if (hasYellow) return 'fuzzy';
    return 'known';
  }

  function updateMasteryDots(fname) {
    // 重新计算当前已渲染目录中 sec-item 的圆点
    document.querySelectorAll('.sec-item').forEach(function (secEl) {
      var f = secEl.dataset.file, idx = secEl.dataset.idx;
      if (!f || !state.cache[f]) return;
      var sec = state.cache[f].sections[idx];
      if (!sec) return;
      var dotCls = sectionMasteryDot(f, sec);
      var dot = secEl.querySelector('.dot');
      if (dot) dot.className = 'dot' + (dotCls ? ' ' + dotCls : '');
    });
  }

  function scrollToSec(idx) {
    var target = content.querySelector('.doc-section[data-idx="' + idx + '"]');
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      // 高亮目录
      document.querySelectorAll('.sec-item').forEach(function (s) { s.classList.remove('active'); });
      var secItems = document.querySelectorAll('.sec-item[data-idx="' + idx + '"]');
      if (secItems.length) secItems[0].classList.add('active');
    }
  }

  // ===== 工具栏 =====
  btnExpand.addEventListener('click', function () {
    content.querySelectorAll('.doc-qa').forEach(function (qa) { qa.classList.add('open'); });
  });
  btnCollapse.addEventListener('click', function () {
    content.querySelectorAll('.doc-qa').forEach(function (qa) { qa.classList.remove('open'); });
    toastMsg('已折叠全部答案，进入刷题清单模式');
  });
  btnRandom.addEventListener('click', function () {
    randomQuestion();
  });
  btnQuiz.addEventListener('click', function () {
    state.quizMode = !state.quizMode;
    saveJSON(KEY_QUIZ, state.quizMode);
    if (state.quizMode) {
      document.body.classList.add('quiz-mode');
      btnQuiz.classList.add('active');
      btnQuiz.textContent = '退出盲答';
      // 折叠所有答案
      content.querySelectorAll('.doc-qa').forEach(function (qa) { qa.classList.remove('open'); });
      toastMsg('抽背模式：已隐藏所有答案，点击问题可对照');
    } else {
      document.body.classList.remove('quiz-mode');
      btnQuiz.classList.remove('active');
      btnQuiz.textContent = '抽背盲答';
      toastMsg('已退出抽背模式');
    }
  });

  function randomQuestion() {
    // 抽取范围：所有含题目的文章（排除自我介绍等无 Q&A 的文件）
    var files = Object.keys(FILE_META).filter(function (f) { return f !== '00-面试自我介绍.html'; });
    // 优先用当前文件（已加载的），否则取第一个
    var target = state.currentFile;
    if (!target || !state.cache[target]) {
      target = files[0];
    }
    // 确保已加载
    var doRandom = function () {
      // 从当前已渲染的 DOM 中抽取题目
      var allQ = [];
      content.querySelectorAll('.doc-qa').forEach(function (qa) {
        var qel = qa.querySelector('.doc-q .qtext');
        if (qel) allQ.push({ qa: qa, text: qel.textContent.trim() });
      });
      if (!allQ.length) { toastMsg('当前文章没有题目，请先切换文章'); return; }
      var pick = allQ[Math.floor(Math.random() * allQ.length)];
      // 滚动到对应题，并展开
      pick.qa.classList.add('open');
      pick.qa.scrollIntoView({ behavior: 'smooth', block: 'center' });
      toastMsg('🎲 随机抽题：' + pick.text.slice(0, 20) + '…');
    };
    if (state.cache[target]) { loadFile(target); setTimeout(doRandom, 300); }
    else { loadFile(target); setTimeout(doRandom, 500); }
  }

  // ===== 搜索 =====
  var searchTimer;
  searchInput.addEventListener('input', function () {
    searchBox.classList.toggle('has-input', !!searchInput.value);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { doSearch(searchInput.value.trim().toLowerCase()); }, 200);
  });
  searchClear.addEventListener('click', function () {
    searchInput.value = ''; searchBox.classList.remove('has-input');
    doSearch('');
    searchInput.focus();
  });

  function doSearch(q) {
    if (!q) {
      emptySearch.style.display = 'none';
      buildTree();
      return;
    }
    tree.innerHTML = '';
    emptySearch.style.display = 'none';
    var results = [];

    // 先收集：文件名 + 已加载文件的 section/题目
    var pendingFiles = [];
    Object.keys(FILE_META).forEach(function (fname) {
      var meta = FILE_META[fname];
      if (meta.name.toLowerCase().indexOf(q) >= 0) {
        results.push({ file: fname, text: meta.name, type: 'file' });
      }
      var data = state.cache[fname];
      if (data) {
        data.sections.forEach(function (s) {
          if (s.name.toLowerCase().indexOf(q) >= 0) {
            results.push({ file: fname, text: s.name, type: 'sec', sectionName: s.name });
          }
          // 匹配该 section 下的题目文本
          if (s.qTexts) {
            s.qTexts.forEach(function (qt) {
              if (qt.toLowerCase().indexOf(q) >= 0) {
                results.push({ file: fname, text: qt, type: 'q', sectionName: s.name });
              }
            });
          }
        });
      } else {
        pendingFiles.push(fname);
      }
    });
    renderSearchResults(results, q);

    // 对未加载的文件按需 fetch 解析，补充题目搜索
    pendingFiles.forEach(function (fname) {
      fetch(fname).then(function (r) { return r.text(); }).then(function (html) {
        var parsed = parseDocument(html);
        state.cache[fname] = parsed;
        buildTree();
        // 重新搜索补结果
        var extra = [];
        parsed.sections.forEach(function (s) {
          if (s.name.toLowerCase().indexOf(q) >= 0) {
            extra.push({ file: fname, text: s.name, type: 'sec', sectionName: s.name });
          }
          if (s.qTexts) {
            s.qTexts.forEach(function (qt) {
              if (qt.toLowerCase().indexOf(q) >= 0) {
                extra.push({ file: fname, text: qt, type: 'q', sectionName: s.name });
              }
            });
          }
        });
        if (extra.length) {
          renderSearchResults(extra, q, true);
        }
      }).catch(function () {});
    });
  }

  function renderSearchResults(results, q, append) {
    if (!append) { tree.innerHTML = ''; emptySearch.style.display = 'none'; }
    if (!results.length) {
      if (!append) emptySearch.style.display = 'block';
      return;
    }
    var ul = document.createElement('ul'); ul.className = 'tree';
    results.forEach(function (r) {
      var li = document.createElement('li');
      var item = document.createElement('div');
      item.className = 'file-item';
      var prefix = r.type === 'q' ? '🔸 ' : r.type === 'sec' ? '📁 ' : '📄 ';
      var sub = r.sectionName ? '<span style="font-size:11px;color:#9ca3af">（' + FILE_META[r.file].name + ' › ' + r.sectionName + '）</span>' : '';
      item.innerHTML = '<span class="fname">' + prefix + r.text + sub + '</span>';
      item.addEventListener('click', function () {
        loadFile(r.file);
        // 定位到问题所在 section
        if (r.sectionName) {
          setTimeout(function () {
            var secs = Array.prototype.map.call(content.querySelectorAll('.doc-section'), function (s) {
              return { el: s, h2: s.querySelector('h2') ? s.querySelector('h2').textContent.trim() : '' };
            });
            secs.forEach(function (s, i) { if (s.h2 === r.sectionName) { scrollToSec(i); } });
          }, 400);
        }
      });
      li.appendChild(item);
      ul.appendChild(li);
    });
    tree.appendChild(ul);
  }

  // ===== 初始化 =====
  buildTree();
  if (loadJSON(KEY_QUIZ, false)) {
    state.quizMode = true;
    document.body.classList.add('quiz-mode');
    btnQuiz.classList.add('active');
    btnQuiz.textContent = '退出盲答';
  }
})();
</script>
</body>
